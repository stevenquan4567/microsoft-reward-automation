<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsoft Reward Automation</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Josefin+Sans:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Alert Toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <span>⚡</span>
        </div>
        <div class="brand-text">
          <h1 id="i18n_app_title">Microsoft Reward Automation</h1>
          <span class="badge" id="i18n_app_badge">v2.1.0 Desktop</span>
        </div>
      </div>
      <div class="header-actions">
        <select id="popupLangSelect" class="lang-select" title="Switch Language">
          <option value="en">🇬🇧 EN</option>
          <option value="vi">🇻🇳 VI</option>
          <option value="zh">🇨🇳 ZH</option>
          <option value="ko">🇰🇷 KO</option>
          <option value="ja">🇯🇵 JA</option>
          <option value="es">🇪🇸 ES</option>
          <option value="fr">🇫🇷 FR</option>
          <option value="de">🇩🇪 DE</option>
          <option value="it">🇮🇹 IT</option>
          <option value="pt">🇧🇷 PT</option>
          <option value="ru">🇷🇺 RU</option>
          <option value="hi">🇮🇳 HI</option>
        </select>
        <button id="btnOptions" class="icon-btn" title="Advanced Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Status Card -->
    <div class="status-card">
      <div class="status-header">
        <span class="status-title" id="i18n_status_label">Status</span>
        <div id="statusPill" class="status-pill idle">
          <span class="dot"></span>
          <span id="statusText">Ready</span>
        </div>
      </div>

      <!-- Radial Progress Circle -->
      <div class="progress-ring-container">
        <svg class="progress-ring" width="130" height="130">
          <circle class="progress-ring-bg" stroke="rgba(255,255,255,0.08)" stroke-width="8" fill="transparent" r="54" cx="65" cy="65"/>
          <circle id="progressCircle" class="progress-ring-fill" stroke="url(#gradient)" stroke-width="8" stroke-dasharray="339.29" stroke-dashoffset="339.29" stroke-linecap="round" fill="transparent" r="54" cx="65" cy="65"/>
          <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00F2FE" />
              <stop offset="100%" stop-color="#4FACFE" />
            </linearGradient>
          </defs>
        </svg>
        <div class="progress-center">
          <span id="progressCount" class="progress-num">0/0</span>
          <span id="progressPercent" class="progress-sub">0%</span>
        </div>
      </div>
    </div>

    <!-- Quick Stats Grid -->
    <div class="stats-grid single-stat">
      <div class="stat-box">
        <div class="stat-icon desktop">🖥️</div>
        <div class="stat-info">
          <span class="stat-label" id="i18n_desktop_searches_today">Desktop Searches Today</span>
          <span id="desktopStats" class="stat-val">0/30</span>
        </div>
      </div>
      <div class="stat-box points-box">
        <div class="stat-icon points">🎁</div>
        <div class="stat-info">
          <span class="stat-label" id="i18n_points_earned">Points Earned Today</span>
          <span id="pointsEarned" class="stat-val">+0 pts</span>
        </div>
      </div>
    </div>

    <!-- Action Controls -->
    <div class="controls">
      <button id="btnStart" class="btn btn-primary glow">
        <span class="btn-icon">🚀</span>
        <span class="btn-text" id="i18n_btn_start_search">START DESKTOP SEARCH</span>
      </button>

      <button id="btnStop" class="btn btn-danger hidden">
        <span>⛔</span>
        <span id="i18n_btn_stop_search">STOP SEARCH</span>
      </button>

      <button id="btnCheckUpdate" class="btn btn-secondary">
        <span>🔄</span>
        <span id="i18n_btn_check_update">🚀 Update & Reload</span>
      </button>
    </div>

    <!-- Quick Links & Ticker -->
    <div class="footer-tools">
      <a href="https://rewards.bing.com/" target="_blank" class="tool-link" id="i18n_link_rewards_dashboard">
        🎁 MS Rewards
      </a>
      <a href="https://www.bing.com/" target="_blank" class="tool-link" id="i18n_link_bing_home">
        🔍 Bing Home
      </a>
      <a href="https://github.com/stevenquan4567/microsoft-reward-automation" target="_blank" class="tool-link" id="i18n_link_github_project">
        ⭐ GitHub
      </a>
      <a href="https://ko-fi.com/stevenquan45" target="_blank" class="tool-link kofi-link" id="i18n_btn_donate_kofi" title="Support on Ko-fi">
        ☕ Ko-fi
      </a>
    </div>

    <!-- Recent Query Ticker -->
    <div class="ticker-box">
      <span class="ticker-label" id="i18n_last_search">Last search:</span>
      <span id="tickerText" class="ticker-text">No searches run today</span>
    </div>
  </div>

  <script src="../data/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsoft Reward Automation</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <span>⚡</span>
        </div>
        <div class="brand-text">
          <h1>Microsoft Reward Auto</h1>
          <span class="badge">v2.0 Desktop</span>
        </div>
      </div>
      <button id="btnOptions" class="icon-btn" title="Cài đặt nâng cao">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Status Card -->
    <div class="status-card">
      <div class="status-header">
        <span class="status-title">Trạng thái</span>
        <div id="statusPill" class="status-pill idle">
          <span class="dot"></span>
          <span id="statusText">Sẵn sàng</span>
        </div>
      </div>

      <!-- Radial Progress Circle -->
      <div class="progress-ring-container">
        <svg class="progress-ring" width="130" height="130">
          <circle class="progress-ring-bg" stroke="rgba(255,255,255,0.08)" stroke-width="8" fill="transparent" r="54" cx="65" cy="65"/>
          <circle id="progressCircle" class="progress-ring-fill" stroke="url(#gradient)" stroke-width="8" stroke-dasharray="339.29" stroke-dashoffset="339.29" stroke-linecap="round" fill="transparent" r="54" cx="65" cy="65"/>
          <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00F2FE" />
              <stop offset="100%" stop-color="#4FACFE" />
            </linearGradient>
          </defs>
        </svg>
        <div class="progress-center">
          <span id="progressCount" class="progress-num">0/0</span>
          <span id="progressPercent" class="progress-sub">0%</span>
        </div>
      </div>
    </div>

    <!-- Quick Stats Grid -->
    <div class="stats-grid single-stat">
      <div class="stat-box">
        <div class="stat-icon desktop">🖥️</div>
        <div class="stat-info">
          <span class="stat-label">Desktop Tìm Kiếm Hôm Nay</span>
          <span id="desktopStats" class="stat-val">0/30</span>
        </div>
      </div>
      <div class="stat-box points-box">
        <div class="stat-icon points">🎁</div>
        <div class="stat-info">
          <span class="stat-label">Điểm Nhận Được</span>
          <span id="pointsEarned" class="stat-val">+0 điểm</span>
        </div>
      </div>
    </div>

    <!-- Action Controls -->
    <div class="controls">
      <button id="btnStart" class="btn btn-primary glow">
        <span class="btn-icon">🚀</span>
        <span class="btn-text">BẮT ĐẦU TÌM KIẾM DESKTOP</span>
      </button>

      <button id="btnStop" class="btn btn-danger hidden">
        <span>⛔</span> TẠM DỪNG TÌM KIẾM
      </button>
    </div>

    <!-- Quick Links & Ticker -->
    <div class="footer-tools">
      <a href="https://rewards.bing.com/" target="_blank" class="tool-link">
        🎁 MS Rewards Dashboard
      </a>
      <a href="https://www.bing.com/" target="_blank" class="tool-link">
        🔍 Bing Home
      </a>
    </div>

    <!-- Recent Query Ticker -->
    <div class="ticker-box">
      <span class="ticker-label">Lần tìm gần nhất:</span>
      <span id="tickerText" class="ticker-text">Chưa chạy lần nào</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
